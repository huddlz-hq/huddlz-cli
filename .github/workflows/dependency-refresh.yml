name: Dependency refresh October 26
on:
  push:
    branches: [chore/dependencies-2026-10-26]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Resolve and validate
        run: |
          go version
          go get -u -t ./...
          go mod tidy
          go list -m -u all
          go mod verify
          test -z "$(gofmt -l cmd internal features)"
          go vet ./...
          go test ./... -count=1
          go build ./cmd/huddlz
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Export canonical resolution
        if: always()
        run: |
          sha256sum go.mod go.sum
          echo MOD_BASE64_BEGIN
          base64 -w 0 go.mod
          echo
          echo MOD_BASE64_END
          echo SUM_BASE64_BEGIN
          base64 -w 0 go.sum
          echo
          echo SUM_BASE64_END
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-dependencies
          path: |
            go.mod
            go.sum
